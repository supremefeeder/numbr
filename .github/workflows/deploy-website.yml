name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'nettsted/github/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create waitlist config from secret
        env:
          NFORMS_ACCESS_KEY: ${{ secrets.NFORMS_ACCESS_KEY }}
        run: |
          if [ -z "$NFORMS_ACCESS_KEY" ]; then
            echo "::error::NFORMS_ACCESS_KEY secret is not set."
            exit 1
          fi
          cat > waitlist.config.js <<EOF
          window.NUMBR_WAITLIST = {
            enabled: true,
            endpoint: 'https://api.nforms.eu/f/${NFORMS_ACCESS_KEY}',
          };
          EOF

      - name: Prepare public site bundle
        run: |
          mkdir -p _site
          cp nettsted/github/index.html _site/
          cp waitlist.config.js _site/
          if [ -f nettsted/github/CNAME ]; then
            cp nettsted/github/CNAME _site/
          fi
          echo "Deploying only:"
          ls -la _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
